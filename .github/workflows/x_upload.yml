name: X Auto Upload

on:
  schedule:
    - cron: '0 7 * * *'   # 16:00 KST
    - cron: '2 7 * * *'   # 16:02 KST
    - cron: '4 7 * * *'   # 16:04 KST
    - cron: '6 7 * * *'   # 16:06 KST
    - cron: '8 7 * * *'   # 16:08 KST
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 생성
        env:
          CONFIG_B64: ${{ secrets.X_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > x_config.py

      - name: 업로드 실행
        run: python x_upload.py tr
