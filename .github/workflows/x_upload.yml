name: X Auto Upload

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '2 7 * * *'
    - cron: '4 7 * * *'
    - cron: '6 7 * * *'
    - cron: '8 7 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Config
        env:
          CONFIG_B64: ${{ secrets.X_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > x_config.py

      - name: Upload
        run: |
          set +e
          python x_upload.py tr
          code=$?
          set -e
          if [ $code -eq 0 ]; then ok=1; fail=0; else ok=0; fail=1; fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"X업로드 - TR ${ok}개 업로드 완료, ${fail}개 실패\"}" \
              "$DISCORD_WEBHOOK"
          fi
          exit $code
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
